# On tag push (v0.1.0, ...), build + publish the merged flash binary to a
# GitHub Release so non-builders can grab a .bin. The build check itself runs
# in build.yml on every push/PR; this only fires on version tags.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create release + upload asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: pio run -t mergebin
      - uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/esp32s3/guerrilla-entropy-merged.bin
          generate_release_notes: true
