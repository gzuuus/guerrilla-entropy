; PlatformIO config for guerrilla-entropy
; Dev target: LilyGo T3S3 V1 (ESP32-S3, 4MB flash, 2MB PSRAM, native USB CDC)
; See AGENTS.md for architecture, gotchas, and conventions.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform    = espressif32
board       = esp32-s3-devkitc-1
framework   = arduino

; T3S3 = 4 MB flash + 2 MB PSRAM. The devkitc-1 board def is the N8 variant
; (8 MB, no PSRAM) — its image header overstates flash size, so the chip fails
; its flash probe at boot. Override all three size knobs (board_build alone
; updates partitions but not the image header):
board_build.flash_size  = 4MB
board_build.partitions  = default.csv
board_upload.flash_size = 4MB

; Native USB CDC — Serial must route to the USB port (no UART bridge on T3S3).
; Build flags per AGENTS.md gotcha #1: native USB CDC, no auto-reset circuit.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_port  = /dev/ttyACM0
upload_port   = /dev/ttyACM0
